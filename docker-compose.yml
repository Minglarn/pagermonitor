services:
  pagermonitor:
    # Use the image generated by GitHub actions, or build locally for testing
    # image: ghcr.io/minglarn/pagermonitor:latest
    build: .
    container_name: pagermonitor
    restart: unless-stopped
    devices:
      # Map the USB devices for RTL-SDR to work (uncomment on Linux host)
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ./data:/app/data
    environment:
      - MQTT_BROKER=${MQTT_BROKER:-127.0.0.1}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASS=${MQTT_PASS:-}
      - MQTT_TOPIC=${MQTT_TOPIC:-pagermonitor/alarms}
      - TZ=${TZ:-Europe/Stockholm}
      # HTTP-autentisering för att skydda webbgränssnittet
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_PASS=${AUTH_PASS:-}
      # VHF ACARS mottagarkonfiguration
      - ACARS_HOST=${ACARS_HOST:-192.168.1.242}
      - ACARS_PORT=${ACARS_PORT:-15550}
      - ACARS_ENABLED=${ACARS_ENABLED:-true}
    ports:
      - "7090:5000"
